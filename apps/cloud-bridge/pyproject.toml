[project]
name = "cloud-bridge"
version = "1.0.0"
description = "FastAPI WebSocket broker, Dynamic Rules Engine & Stamina Engine for SpatialTwin"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.9.0",
    "websockets>=13.0",
    "jsonpath-ng>=1.6.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
