version: "3.8"

services:
  cloud-bridge:
    build:
      context: ..
      dockerfile: docker/Dockerfile.bridge
    container_name: spatialtwin-cloud-bridge
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  web-runtime:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: spatialtwin-web-runtime
    ports:
      - "3000:80"
    depends_on:
      - cloud-bridge
    restart: unless-stopped
